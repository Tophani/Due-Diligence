<div style="min-height: 100vh; padding: 32px 16px 64px">

        </div>

      <a href="VendorSimpleStart.dc.html" style="font-size: 14px">Save and finish later</a>
    </div>
  </div>
</div>

        q.tt = !!e.tt; q.chg = e.chg || false; q.na = !!e.na; q.why = e.why || '';
        q.hasFiles = files.length > 0;
        q.files = files.map((name, k) => ({ name, style: e.chg && k === 0 ? 'text-decoration:line-through;color:#5B6577' : '', remove: () => { const nf = files.filter((x, j) => j !== k); this.upd(ref, { files: nf, chg: e.chg && k === 0 ? '' : e.chg }); } }));
        q.canAdd = !e.tt && !e.na; q.canNa = files.length === 0;
        q.addLabel = files.length ? 'Add another file' : 'Add file';
        q.add = () => this.upd(ref, { files: files.filter((x, k) => !(e.chg && k === 0)).concat([slug(i.title) + '_2026.pdf']), chg: '' });
        q.setNa = () => this.upd(ref, { na: true }); q.undoNa = () => this.upd(ref, { na: false, why: '' }); q.onWhy = (ev) => this.upd(ref, { why: ev.target.value });
      }
      entries.push(q);
    });
    return {
      sec, secTitle: SECS[sec - 1], intro: INTRO[sec], pagePct: Math.round((sec / 12) * 100) + '%', entries, saveText: this.state.saved,
      hasBack: sec > 1, hasNext: sec < 3, isLast: sec === 3,
      back: () => this.go(sec - 1), next: () => this.go(sec + 1)
    };
  }
}
</script>
