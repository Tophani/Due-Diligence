<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<aside style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #C8D3E6; background: #12284C; box-sizing: border-box; width: 100%; height: 100%; min-height: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <a href="AdminDashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; padding: 0 6px">
    <span style="width: 34px; height: 34px; border-radius: 8px; background: #fff; color: #12284C; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">TT</span>
    <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 600; font-size: 15px">TracTrac</span><span style="font-size: 12px; color: #A9B8D2">Compliance Admin</span></span>
  </a>
  <div style="background: rgba(255,255,255,.07); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #A9B8D2">Active cycle</span>
    <span style="font-size: 13px; color: #fff; font-weight: 500">2026 Partner Due Diligence · Cycle 2</span>
    <span style="font-size: 12px; color: #A9B8D2">Deadline 15 Dec 2026</span>
  </div>
  <nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 2px; font-size: 14px">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="10">
      <a href="{{l.href}}" aria-current="{{l.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; {{l.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg>
        <span style="flex: 1">{{l.label}}</span>
        <sc-if value="{{l.count}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; background: #F5B84B; color: #3D2600; border-radius: 99px; padding: 1px 7px; font-weight: 600">{{l.count}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 14px 6px 0; display: flex; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2B4A7A; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">FA</span>
    <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 13px; color: #fff; font-weight: 500">Funmi Adeyemi</span><span style="font-size: 12px; color: #A9B8D2">Super Admin</span></span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","organisations","monitoring","reviews","uploads","questionnaires","cycles","reports","users","settings"],"default":"dashboard"},"$preview":{"width":260,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const items = [
      ['dashboard', 'Dashboard', 'AdminDashboard.dc.html', 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z', 0],
      ['organisations', 'Organisations', 'AdminOrganisations.dc.html', 'M4 21V5l8-2v18M12 7l8 3v11M2 21h20M7 9h2M7 13h2M7 17h2M15 13h2M15 17h2', 0],
      ['monitoring', 'Assessment Monitoring', 'AdminMonitoring.dc.html', 'M3 12h4l3-8 4 16 3-8h4', 0],
      ['reviews', 'Document Reviews', 'AdminReview.dc.html', 'M14 3H6v18h12V7zM14 3v4h4M9 14l2 2 4-4', 23],
      ['uploads', 'Existing Document Uploads', 'AdminUpload.dc.html', 'M12 16V4M7 9l5-5 5 5M4 17v3h16v-3', 0],
      ['questionnaires', 'Questionnaire Management', 'AdminQuestionnaires.dc.html', 'M9 5h10M9 12h10M9 19h10M4 5h1M4 12h1M4 19h1', 0],
      ['cycles', 'Assessment Cycles', 'AdminCycles.dc.html', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', 0],
      ['reports', 'Reports', 'AdminReports.dc.html', 'M5 20V10M12 20V4M19 20v-7', 0],
      ['users', 'User Management', '#', 'M16 20v-1a4 4 0 00-4-4H6a4 4 0 00-4 4v1M9 11a4 4 0 100-8 4 4 0 000 8zM22 20v-1a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8', 0],
      ['settings', 'Settings', '#', 'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00-1.2-2.9H3a2 2 0 110-4h.1a1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 002.9-1.2V3a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z', 0]
    ];
    return {
      links: items.map(([k, label, href, icon, count]) => ({
        label, href, icon, count: count || false,
        current: k === a ? 'page' : 'false',
        style: k === a ? 'background:rgba(255,255,255,.12);color:#fff;font-weight:600' : 'color:#C8D3E6;font-weight:500'
      }))
    };
  }
}
</script>
</body>
</html>
